version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    ignore:
      # Origam targets .NET 8, so keep this package on the .NET 8-compatible major version until upgrade to .NET 10.
      - dependency-name: "Microsoft.Extensions.Logging.Log4Net.AspNetCore"
        versions: [">=9.0.0"]
      # Microsoft.VisualStudio.Web.CodeGeneration.Design 8.0.7 requires Roslyn 4.8.0 exactly.
      - dependency-name: "Microsoft.CodeAnalysis.Common"
        versions: [">=4.8.1"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions: [">=4.8.1"]
      - dependency-name: "Microsoft.CodeAnalysis.VisualBasic"
        versions: [">=4.8.1"]
  - package-ecosystem: "npm"
    directory: "/frontend-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
  - package-ecosystem: "npm"
    directory: "/architect-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    ignore:
      - dependency-name: "eslint"
        versions: [">=10.0.0 <10.1.0"]
  - package-ecosystem: "npm"
    directory: "/chat-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    ignore:
      # Draft.js and react-draft-wysiwyg require Immutable 3.x or 4.x.
      - dependency-name: "immutable"
        versions: [">=5.0.0"]

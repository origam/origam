version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    groups:
      csharpier:
        patterns:
          - "csharpier"
          - "CSharpier.MsBuild"
      nuget-test-patches:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "Moq"
          - "NUnit"
          - "NUnit3TestAdapter"
        update-types:
          - "patch"
      nuget-test-minors:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "Moq"
          - "NUnit"
          - "NUnit3TestAdapter"
        update-types:
          - "minor"
      log4net:
        patterns:
          - "log4net"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep Microsoft.OpenApi on the 2.x release line. Upgrading to 3.x requires additional migration work.
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]
      # Microsoft.VisualStudio.Web.CodeGeneration.Design 10.0.2 requires Roslyn 5.0.0 exactly.
      - dependency-name: "Microsoft.CodeAnalysis.Common"
        versions: [">=5.0.1"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions: [">=5.0.1"]
      - dependency-name: "Microsoft.CodeAnalysis.VisualBasic"
        versions: [">=5.0.1"]
  - package-ecosystem: "npm"
    directory: "/frontend-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    groups:
      frontend-react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      frontend-test-patches:
        dependency-type: "development"
        patterns:
          - "@testing-library/dom"
          - "@testing-library/jest-dom"
          - "@testing-library/react"
          - "@testing-library/user-event"
          - "@types/jest"
          - "identity-obj-proxy"
          - "jest"
          - "jest-environment-jsdom"
          - "ts-jest"
        update-types: ["patch"]
      frontend-test-minors:
        dependency-type: "development"
        patterns:
          - "@testing-library/dom"
          - "@testing-library/jest-dom"
          - "@testing-library/react"
          - "@testing-library/user-event"
          - "@types/jest"
          - "identity-obj-proxy"
          - "jest"
          - "jest-environment-jsdom"
          - "ts-jest"
        update-types: ["minor"]
      frontend-vite-patches:
        dependency-type: "development"
        patterns: ["vite", "@vitejs/plugin-react"]
        update-types: ["patch"]
      frontend-dev-patches:
        dependency-type: "development"
        update-types: ["patch"]
    ignore:
      # Keep mobx on the 6.x release line. Upgrading to 7.x requires additional migration work.
      - dependency-name: "mobx"
        versions: [">=7.0.0"]
      # The frontend imports AutoSizer from react-virtualized 9.
      - dependency-name: "react-virtualized"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: "npm"
    directory: "/architect-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    groups:
      architect-react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      architect-vite-patches:
        dependency-type: "development"
        patterns: ["vite", "@vitejs/plugin-react"]
        update-types: ["patch"]
      architect-dev-patches:
        dependency-type: "development"
        update-types: ["patch"]
    ignore:
      - dependency-name: "eslint"
        versions: [">=10.0.0 <10.1.0"]
  - package-ecosystem: "npm"
    directory: "/chat-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    groups:
      chat-react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      chat-dev-patches:
        dependency-type: "development"
        update-types: ["patch"]
    ignore:
      # Draft.js and react-draft-wysiwyg require Immutable 3.x or 4.x.
      - dependency-name: "immutable"
        versions: [">=5.0.0"]
      # The chat client uses React 17 and imports AutoSizer from react-virtualized 9. Remove when react in chat is upgaded.
      - dependency-name: "react-virtualized"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    groups:
      csharpier:
        patterns:
          - "csharpier"
          - "CSharpier.MsBuild"
    ignore:
      # Keep Microsoft.OpenApi on the 2.x release line. Upgrading to 3.x requires additional migration work.
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]
      # Microsoft.VisualStudio.Web.CodeGeneration.Design 10.0.2 requires Roslyn 5.0.0 exactly.
      - dependency-name: "Microsoft.CodeAnalysis.Common"
        versions: [">=5.0.1"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions: [">=5.0.1"]
      - dependency-name: "Microsoft.CodeAnalysis.VisualBasic"
        versions: [">=5.0.1"]
  - package-ecosystem: "npm"
    directory: "/frontend-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    ignore:
      # Keep mobx on the 6.x release line. Upgrading to 7.x requires additional migration work.
      - dependency-name: "mobx"
        versions: [">=7.0.0"]
  - package-ecosystem: "npm"
    directory: "/architect-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    ignore:
      - dependency-name: "eslint"
        versions: [">=10.0.0 <10.1.0"]
  - package-ecosystem: "npm"
    directory: "/chat-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    ignore:
      # Draft.js and react-draft-wysiwyg require Immutable 3.x or 4.x.
      - dependency-name: "immutable"
        versions: [">=5.0.0"]

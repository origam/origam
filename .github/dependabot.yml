version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    ignore:
      # Origam targets .NET 8, so keep this package on the .NET 8-compatible major version until upgrade to .NET 10.
      - dependency-name: "Microsoft.Extensions.Logging.Log4Net.AspNetCore"
        versions: [">=9.0.0"]
  - package-ecosystem: "npm"
    directory: "/frontend-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
  - package-ecosystem: "npm"
    directory: "/architect-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
    ignore:
      - dependency-name: "eslint"
        versions: [">=10.0.0 <10.1.0"]
  - package-ecosystem: "npm"
    directory: "/chat-html"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
      include:
        - "*"
    commit-message:
      prefix: "DEV: "
